<main>
  <!-- Navigation Tabs -->
  <nav class="sticky top-20 z-40 bg-white border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-6 flex gap-8 overflow-x-auto">
      <button
        (click)="navigateTo('inicio')"
        class="py-4 px-2 font-semibold whitespace-nowrap"
        [ngClass]="{
          'text-arsa-primary border-b-2 border-arsa-primary': activeSection === 'inicio',
          'text-gray-600 hover:text-arsa-dark': activeSection !== 'inicio',
        }"
      >
        Inicio
      </button>
      <button
        (click)="navigateTo('privacidad')"
        class="py-4 px-2 font-semibold whitespace-nowrap"
        [ngClass]="{
          'text-arsa-primary border-b-2 border-arsa-primary': activeSection === 'privacidad',
          'text-gray-600 hover:text-arsa-dark': activeSection !== 'privacidad',
        }"
      >
        Privacidad
      </button>
      <button
        (click)="navigateTo('eliminar')"
        class="py-4 px-2 font-semibold whitespace-nowrap"
        [ngClass]="{
          'text-arsa-primary border-b-2 border-arsa-primary': activeSection === 'eliminar',
          'text-gray-600 hover:text-arsa-dark': activeSection !== 'eliminar',
        }"
      >
        Eliminar Cuenta
      </button>
    </div>
  </nav>

  <!-- ===== INICIO ===== -->
  <section *ngIf="activeSection === 'inicio'" class="py-28 bg-gradient-to-b from-white to-gray-50">
    <div class="max-w-4xl mx-auto px-6 text-center">
      <div
        class="inline-flex items-center px-4 py-2 rounded-full bg-orange-50 border border-orange-200 text-orange-600 text-sm font-bold mb-8"
      >
        Próximamente
      </div>

      <h1 class="text-6xl md:text-8xl font-black text-arsa-dark mb-6 tracking-tight">
        Run Run Run
      </h1>

      <p class="text-2xl text-gray-500 font-semibold mb-8">🏃‍♂️🏃‍♀️🏃</p>

      <p class="text-xl text-gray-600 max-w-2xl mx-auto mb-12 leading-relaxed">
        Una nueva aplicación está en camino. Diseñada para <strong>runners</strong>,
        corredores y comunidad.
      </p>

      <div class="max-w-md mx-auto bg-white border border-gray-200 rounded-2xl p-8 shadow-sm">
        <div class="text-4xl mb-4">⏳</div>
        <h3 class="text-xl font-bold text-arsa-dark mb-2">Pronto sabrás más</h3>
        <p class="text-gray-500">
          Estamos trabajando en algo increíble para la comunidad runner.
          Regresa pronto para más detalles.
        </p>
      </div>
    </div>
  </section>

  <!-- ===== PRIVACIDAD / ELIMINAR CUENTA (compartidas) ===== -->
  <app-privacidad-eliminar
    [appName]="'Run Run Run'"
    [activeSection]="activeSection"
  ></app-privacidad-eliminar>
</main>
