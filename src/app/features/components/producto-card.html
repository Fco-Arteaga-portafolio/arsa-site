<div
  class="group relative bg-white rounded-2xl overflow-hidden border border-gray-200 transition-all shadow-lg hover:shadow-2xl"
  [ngClass]="borderColorClass"
>
  <!-- Gradient overlay on hover -->
  <div
    class="absolute inset-0 bg-gradient-to-br to-transparent opacity-0 group-hover:opacity-100 transition-opacity"
    [ngClass]="gradientOverlayClass"
  ></div>

  <div class="relative p-8 md:p-12">
    <!-- Icon Container -->
    <div
      class="mb-8 w-24 h-24 rounded-xl flex items-center justify-center text-white text-4xl shadow-lg"
      [ngClass]="[
        'bg-gradient-to-br',
        isAccentColor ? 'from-arsa-accent to-blue-500' : 'from-arsa-primary to-arsa-accent',
      ]"
    >
      {{ producto.icono }}
    </div>

    <!-- Content -->
    <h2 class="text-3xl font-black text-arsa-dark mb-4">{{ producto.titulo }}</h2>

    <p class="text-gray-600 text-lg mb-8 leading-relaxed">
      {{ producto.descripcion }}
    </p>

    <!-- Features -->
    <ul class="space-y-3 mb-8">
      <li *ngFor="let feature of producto.caracteristicas" class="flex items-start gap-3">
        <span class="font-bold mt-1" [ngClass]="featureIconColor">✓</span>
        <span class="text-gray-700">{{ feature }}</span>
      </li>
    </ul>

    <!-- CTA Button -->
    <button
      (click)="irA()"
      class="inline-block text-white px-8 py-3 rounded-xl font-bold hover:shadow-lg transition-all"
      [ngClass]="[
        isAccentColor ? 'bg-cyan-600 hover:bg-cyan-700' : 'bg-blue-600 hover:bg-blue-700',
      ]"
    >
      {{ producto.botonTexto }}
    </button>
  </div>
</div>
