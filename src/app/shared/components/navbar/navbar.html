<header class="arsa-navbar">
  <div class="arsa-navbar__inner">
    <a href="/#inicio" class="arsa-brand" (click)="closeMobileMenu()" aria-label="ARSA inicio">
      <span class="arsa-brand__mark"><img src="/arsa-logo.png" alt="" /></span>
      <span>AR-SA</span>
    </a>

    <nav class="arsa-nav" aria-label="Navegación principal">
      <a href="/#servicios">Servicios</a>
      <a href="/#portafolio">Portafolio</a>
      <a href="/#tecnologias">Tecnologías</a>
      <a href="/#proceso">Proceso</a>
      <a href="/#fundadores">Fundadores</a>
      <a routerLink="/enterprise">Enterprise</a>
      <a href="/#contacto">Contacto</a>
    </nav>

    <button class="arsa-nav__cta" type="button" (click)="diagnosticService.openModal()">Cotizar sin costo <span>↗</span></button>
    <button class="arsa-nav__toggle" type="button" (click)="toggleMobileMenu()" [attr.aria-expanded]="isMobileMenuOpen" aria-label="Abrir menú">
      @if (!isMobileMenuOpen) { <span></span><span></span> } @else { <span class="close-line"></span><span class="close-line"></span> }
    </button>
  </div>

  @if (isMobileMenuOpen) {
    <div class="arsa-mobile-menu">
      <a href="/#servicios" (click)="closeMobileMenu()">Servicios <span>↘</span></a>
      <a href="/#portafolio" (click)="closeMobileMenu()">Portafolio <span>↘</span></a>
      <a href="/#tecnologias" (click)="closeMobileMenu()">Tecnologías <span>↘</span></a>
      <a href="/#proceso" (click)="closeMobileMenu()">Proceso <span>↘</span></a>
      <a href="/#fundadores" (click)="closeMobileMenu()">Fundadores <span>↘</span></a>
      <a routerLink="/enterprise" (click)="closeMobileMenu()">Enterprise <span>↗</span></a>
      <a href="/#contacto" (click)="closeMobileMenu()">Contacto <span>↘</span></a>
      <button type="button" (click)="closeMobileMenu(); diagnosticService.openModal()">Cotizar sin costo <span>↗</span></button>
    </div>
  }
</header>
